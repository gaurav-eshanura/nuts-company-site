name: Deploy

# Every push to main: regenerate the site, verify it, prove the gate still
# bites, publish it, then tell the search engines it changed.
#
# Assets and fonts are committed, so the pipeline needs neither the design
# sheet nor network access to Google Fonts.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # ---- validation: runs on every push, needs no credentials ------------

      - name: Build pages
        run: npm run build

      - name: Verify links, catalogue, SEO and a11y basics
        run: npm run check

      # Injects 14 regressions one at a time and asserts each is caught, so a
      # gate that has quietly stopped failing is itself a build failure.
      - name: Fault-inject the gate
        run: npm run test:gate

      # dist.mjs already refuses to write an incomplete dist and exits non-zero.
      - name: Assemble dist
        run: npm run dist

      # ---- publish: needs a Firebase credential ---------------------------

      - name: Deploy to Firebase Hosting
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          npx --yes firebase-tools@latest deploy \
            --only hosting \
            --project thenutscompany-eshanura \
            --non-interactive \
            --token "${{ secrets.FIREBASE_TOKEN }}"

      - name: Report that nothing was published
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT == '' }}
        run: |
          echo "::notice title=Validation passed, nothing published::"
          echo "::notice::Add the FIREBASE_SERVICE_ACCOUNT and FIREBASE_TOKEN"
          echo "::notice::secrets to let this workflow deploy. Until then run"
          echo "::notice::npm run deploy locally."

      # ---- tell the engines -------------------------------------------------

      - name: Notify search engines
        run: npm run submit
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
