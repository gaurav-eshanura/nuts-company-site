name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build pages
        run: npm run build
      - name: Verify
        run: npm run check
      - name: Fault-inject the gate
        run: npm run test:gate
      - name: Assemble dist
        run: npm run dist
      - name: Notify search engines
        run: npm run submit
